services:
  unbagged:
    build:
      context: .
      # Pinned on purpose. The Dockerfile's LAST stage is `dev`, and a build with
      # no target builds the last stage — so omitting this shipped the dev image,
      # editable install and --reload and all, as production.
      target: runtime
    image: unbagged:local
    ports:
      # The 127.0.0.1 prefix is load-bearing and deliberately sits OUTSIDE the
      # interpolation. Without it Docker publishes on every interface and
      # punches straight through the host firewall, which would put two years of
      # your groceries on the local network. Only the port number is
      # configurable; the interface is not.
      #
      # Change the port with UNBAGGED_PORT in a .env file (see .env.example).
      - "127.0.0.1:${UNBAGGED_PORT:-8420}:8000"
    volumes:
      # Your reports and your database, on your disk. Back the whole thing up by
      # copying this directory.
      - ./data:/data
    # UNBAGGED_DB and UNBAGGED_INCOMING are not set here on purpose. They are
    # declared once, in the Dockerfile, so there is one source of truth. Setting
    # them again here and in the dev overlay meant three copies, and the overlay
    # copy could silently drift out of step with this one.
    #
    # on-failure, not unless-stopped. A permanently failing entrypoint (an
    # unwritable ./data, say) used to restart forever, printing its own
    # explanation faster than anyone could read it — measured at 7 restarts in
    # 12 seconds. Three attempts is enough to ride out a transient crash and few
    # enough to leave the message on screen.
    restart: on-failure:3
