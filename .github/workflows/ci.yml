name: CI

# Actions are pinned to commit SHAs, not tags. A tag is a movable pointer the
# action's owner controls: whoever can push to that repository can repoint v4 at
# new code, and it runs here on the next push with no diff in this file. That is
# the ordinary shape of a CI supply-chain compromise, and this repository's job
# is reading files that contain people's home addresses. The trailing comment is
# the human-readable version; the SHA is what runs. Bump both together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safeguards:
    name: PII safeguards
    runs-on: ubuntu-latest
    steps:
      # Full history: a contributor who commits their real report and then amends
      # it away must still be caught before merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Explicit rather than implied by the full fetch: check_signers.py
          # refuses to verify an empty set of tags, so a checkout without them
          # fails the job loudly instead of passing having checked nothing.
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Scan the checkout
        run: python tools/scan_pii.py

      - name: Scan the history introduced by this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python tools/scan_pii.py --history "origin/${{ github.base_ref }}..HEAD"

      - name: Scan the full history
        if: github.event_name == 'push'
        run: python tools/scan_pii.py --history

      - name: Refuse tracked files under data/
        run: |
          # data.bak-* is included on purpose: `make reset` renames ./data to
          # data.bak-<timestamp> and leaves it in the checkout holding every
          # report and the database, under a name `data` does not match.
          tracked=$(git ls-files -- data output 'data.bak-*' || true)
          if [ -n "$tracked" ]; then
            echo "Tracked files under a data directory:"; echo "$tracked"; exit 1
          fi

      # resources/ holds two source SVGs and six files build_icons.py makes from
      # them. Nothing re-runs that generator, and build_brand --check compares
      # frontend/public/ against resources/ rather than resources/ against the
      # SVGs -- so editing a source and running `make brand` shipped stale icons
      # with every gate green. Pull requests only: it needs a base to diff from.
      # A signature nobody can check is decoration. This asserts that the
      # signers file committed beside the tags still verifies every one of
      # them -- which is what a rotation that replaces a key instead of adding
      # one would break, permanently, since a signed tag can never be re-signed
      # under a ruleset that blocks deletion and non-fast-forward.
      - name: Verify every tag against the committed signers file
        run: python tools/check_signers.py

      - name: Refuse a source SVG that moved without its icons
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python tools/check_icon_sync.py "origin/${{ github.base_ref }}"

      - name: Verify committed fixtures are generator output
        # Load-bearing: scan_pii.py stands a few address-shaped rules down inside
        # generated fixture directories, and byte-identical regeneration from a
        # fixed seed is what replaces them. A real report dropped into a fixtures
        # directory does not reproduce from the seed.
        run: |
          pip install -e ".[dev]"
          python tools/make_fixtures.py --check

      - name: Verify fixture directories are the only re-inclusions
        run: |
          # Committed report-shaped files must live under a fixtures/ directory,
          # where `make fixtures-check` above proves they are generator output.
          # Anything else claiming to be sample data has bypassed the generator.
          #
          # The suffix list mirrors .gitignore's denials. It is long because every
          # one of these is a format a right-to-know response actually arrives as
          # AND a format tools/scan_pii.py cannot read, so a miss here is a miss
          # everywhere. Keep the two lists in step.
          stray=$(git ls-files \
            '*.csv' '*.tsv' '*.pdf' '*.zip' '*.7z' '*.rar' '*.tar' '*.tar.gz' '*.tgz' \
            '*.xls' '*.xlsx' '*.ods' '*.doc' '*.docx' '*.eml' '*.mbox' \
            | grep -v '/fixtures/' || true)
          if [ -n "$stray" ]; then
            echo "Report-shaped files outside fixtures/:"; echo "$stray"; exit 1
          fi

      - name: Refuse a fixtures exemption that nothing verifies
        run: |
          # .gitignore re-includes fixtures directories, and scan_pii.py stands
          # address rules down inside them. Both are safe only because
          # make_fixtures.py --check covers those directories. A re-inclusion it
          # does not cover is an exemption with nothing behind it.
          bad=$(grep -n '^!' .gitignore | grep -v 'src/\*\*/fixtures/\*\*' || true)
          if [ -n "$bad" ]; then
            echo "Unverified .gitignore re-inclusion:"; echo "$bad"
            echo "make_fixtures.py --check only covers src/**/fixtures/."
            exit 1
          fi

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      # The image installs docker/requirements.txt with --require-hashes; this
      # fails when it no longer covers what pyproject.toml declares. Regenerating
      # the lock to compare would need Docker and a network round trip, so the
      # thorough version is `make lock` and this is the fast half.
      - run: python tools/check_lock.py
      # frontend/public/ is generated from resources/ with the C2PA manifests
      # stripped. Copying a source across by hand instead ships several KB of
      # provenance record on every page load and passes every other check.
      - run: python tools/build_brand.py --check

  hooks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The UI unit tests cover the pure functions behind what the reader sees:
      # the chart's scale, the gauge width, the footing check, the colour hash.
      - run: npm test
        working-directory: frontend
      # The zero-external-request guarantee is asserted against the built output,
      # so the build has to happen before the tests that check it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_frontend_build.py

  container:
    name: Container runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,browser]"
      # Chromium for the layout regression test. Keyed on the lockfile so the
      # ~350MB download happens once per dependency change rather than per run.
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: playwright install --with-deps chromium
      # Linux runners have real uid semantics, so the bind-mount ownership tests
      # that skip on Docker Desktop actually run here. This is the only place
      # the Linux first-run path is covered — and the only place a browser
      # asserts that no view scrolls the page sideways.
      - run: pytest -q -m container
