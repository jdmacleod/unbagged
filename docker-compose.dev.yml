# Overlay for contributors. Adds a Vite dev server with hot reload and mounts
# the source, so neither side needs rebuilding to see a change.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# or just `make dev`, which prints the URL.
#
# Dev mode publishes ONE port: http://localhost:5173. The API is reachable
# through it at /api, because Vite proxies to the backend over the compose
# network. The backend's own port is deliberately not published — it would serve
# the UI bundle frozen into the image at build time, with no hot reload and no
# indication that it was stale, and there is no way to tell the two apart from
# the browser.
services:
  unbagged:
    build:
      context: .
      # The dev stage reinstalls the package editable so /app/src is what gets
      # imported. Without it, uvicorn --reload restarts and re-imports the same
      # unchanged copy from site-packages. Environment defaults are inherited
      # from the runtime stage via `FROM runtime AS dev`.
      target: dev
    ports: !override []
    volumes:
      - ./data:/data
      - ./src:/app/src:ro
      # VERSION as well as the source. The dev stage bakes /app/VERSION at build
      # time and _read_version() prefers that file over install metadata, so
      # bumping VERSION with the stack running would otherwise reload against
      # the baked copy and go on reporting the old number.
      - ./VERSION:/app/VERSION:ro

  web:
    image: node:22-slim
    working_dir: /app/frontend
    # npm ci deletes node_modules before installing, so the named volume below
    # buys nothing on a re-run and every start pays the full ~9s. npm install is
    # a no-op when the lockfile already matches what is on disk; --no-audit and
    # --no-fund drop two network round trips we do not need.
    #
    # --no-save because ./frontend is the real checkout, not a copy. This image
    # carries npm 10, and a lockfile written by npm 11 records a `libc` field
    # per optional platform dependency that npm 10 does not know about and
    # silently drops — 54 lines of it here. Without --no-save, `make dev` edits
    # a tracked file as a side effect of starting, the change reverses the next
    # time anyone runs npm on the host, and the file it rewrites is the one
    # `npm ci` builds the shipped image from.
    command: sh -c "npm install --no-save --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app/frontend
      # Keep the container's node_modules out of the host checkout, so a Linux
      # build does not overwrite a macOS one.
      - unbagged_node_modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # Vite proxies /api to the backend service by name inside the compose
      # network; see vite.config.ts.
      VITE_API_PROXY: http://unbagged:8000
    depends_on:
      - unbagged

volumes:
  unbagged_node_modules:
