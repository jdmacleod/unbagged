[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[project]
name = "unbagged"
# Read from the VERSION file at the repo root, which is the single source of
# truth and the thing a release bumps. Keeping a literal here as well means one
# of the two is always the stale one.
dynamic = ["version"]
description = "Read what the grocery store knows about you."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jason MacLeod" }]
keywords = ["ccpa", "cpra", "privacy", "dsar", "right-to-know"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Runtime dependencies are added by the milestone that first needs them, so the
# safeguard tooling stays installable and fast in CI. fastapi/uvicorn arrive at M4.
dependencies = [
    "pdfplumber>=0.11",        # text extraction, page by page
    "pypdf>=4",                # structure: page count, metadata
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9", # multipart upload parsing
]

[project.optional-dependencies]
dev = [
    "faker>=30",
    "httpx>=0.27",   # fastapi's TestClient
    "pyyaml>=6",     # reading compose files in the packaging tests
    "pytest>=8.0",
    "pre-commit>=3.7",
    "ruff>=0.5",
]

# A browser, only for the layout regression test. Its own group because it
# pulls a 350MB Chromium: `make test` must stay a few seconds and must not
# require one. The container job installs `.[dev,browser]`; everything else
# installs `.[dev]` and the layout test skips with a visible reason.
browser = [
    "playwright>=1.49",
]

[project.scripts]
unbagged = "unbagged.cli:main"

[project.urls]
Homepage = "https://github.com/jdmacleod/unbagged"

[tool.hatch.build.targets.wheel]
packages = ["src/unbagged"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# The container tier builds an image and runs it. Excluded from the default run
# so `make test` stays a few seconds; `make test-container` opts in.
addopts = "-m 'not container'"
markers = [
    "container: runs a real container (slow, needs Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
