[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[project]
name = "unbagged"
# Read from the VERSION file at the repo root, which is the single source of
# truth and the thing a release bumps. Keeping a literal here as well means one
# of the two is always the stale one.
dynamic = ["version"]
description = "Read what the grocery store knows about you."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jason MacLeod" }]
keywords = ["ccpa", "cpra", "privacy", "dsar", "right-to-know"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Runtime dependencies are added by the milestone that first needs them, so the
# safeguard tooling stays installable and fast in CI. fastapi/uvicorn arrive at M4.
dependencies = [
    "pdfplumber>=0.11",        # text extraction, page by page
    "pypdf>=4",                # structure: page count, metadata
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9", # multipart upload parsing
]

[project.optional-dependencies]
dev = [
    "faker>=30",
    "httpx>=0.27",   # fastapi's TestClient
    "pyyaml>=6",     # reading compose files in the packaging tests
    # tools/build_brand.py strips PNG metadata with it, and `make brand-check`
    # runs in CI. It arrived only transitively through pdfplumber, so a build
    # tool depended on an unrelated PDF library's dependency graph. A floor, not
    # a pin: --check compares decoded pixels, so an encoder change is invisible
    # to it. Pillow parses images inside user-supplied PDFs at runtime and has a
    # steady CVE cadence, and an exact pin here would have frozen the developer
    # and CI environment out of its security updates to stabilise a byte
    # comparison that no longer exists.
    "pillow>=11",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "ruff>=0.5",
]

# A browser, only for the layout regression test. Its own group because it
# pulls a 350MB Chromium: `make test` must stay a few seconds and must not
# require one. The container job installs `.[dev,browser]`; everything else
# installs `.[dev]` and the layout test skips with a visible reason.
browser = [
    "playwright>=1.49",
]

[project.scripts]
unbagged = "unbagged.cli:main"

[project.urls]
Homepage = "https://github.com/jdmacleod/unbagged"

[tool.hatch.build.targets.wheel]
packages = ["src/unbagged"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# The container tier builds an image and runs it. Excluded from the default run
# so `make test` stays a few seconds; `make test-container` opts in.
addopts = "-m 'not container'"
markers = [
    "container: runs a real container (slow, needs Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
# S is flake8-bandit. It was not selected before, which meant the `# noqa: S608`
# already sitting in ingest.py silenced a rule that had never been running —
# the suppression looked like a reviewed decision and was inert. Selecting it
# makes every such marker mean what it appears to mean.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and a test that cannot use `assert` is a test nobody writes.
# The container tier drives `docker` and `playwright` by name and opens
# http://127.0.0.1 URLs it built itself: test infrastructure, no untrusted input.
# Seeded PRNGs in the scoring tests are reproducibility, not cryptography.
"tests/**" = ["S101", "S311"]
"tests/container/**" = ["S101", "S310", "S603", "S607"]
"tests/test_build_denylist.py" = ["S101", "S603", "S607"]
# Builds a throwaway git repository in tmp_path to prove the icon gate reads
# its escape marker out of real commit messages rather than a mocked string.
"tests/test_check_icon_sync.py" = ["S101", "S603", "S607"]
# The safeguard tooling shells out to git by name, on argument lists it builds
# itself from literals and repo-relative paths. Resolving an absolute git path
# would only move the trust, and there is no untrusted input on these calls.
"tools/**" = ["S603", "S607"]
# Fixture generators are seeded PRNGs on purpose: reproducibility is the point,
# and `secrets` would defeat `make fixtures-check`.
"src/unbagged/adapters/*/fixtures/generate.py" = ["S311"]
